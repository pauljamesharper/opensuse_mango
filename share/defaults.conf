# defaults.conf — the setup's mango defaults, Super as the mod key.
# This file is the setup's and is replaced on every update: put your own
# settings in ~/.config/mango/local.conf (read after this, so yours win),
# your keys in keybinds.conf and what starts with the session in
# autostart.conf, beside it. Reload live with
# Super+Shift+r. Full option list: /etc/mango/config.conf
# Everything this file runs lives beside it in ~/.local/share/mango
# (scripts/, quickshell/, rofi/, dunst/, kitty/); generated files (the
# palette, the themed dunst config) are in ~/.local/state/mango.

# --- look ---
# borderpx and unfocused_opacity (1.0 = no dimming) have sliders in the
# bar's layout picker (persisted to mango-effects along with the toggles).
borderpx=2
border_radius=8
# inner gaps come from the bar's "window gap" slider (mango-gaps file);
# outer gaps match the bar's edge inset so windows float like the bar does.
# 8 is the 1080p value — the bar re-applies it scaled to the screen on start.
gappih=5
gappiv=5
gappoh=8
gappov=8
focuscolor=0x80a0ffff
bordercolor=0x080808ff
urgentcolor=0xef9f76ff
# the wallpaper picker writes the picked colors (and the wallpaper line)
# to theme.conf, sourced below after awww-daemon; they win over these.
# --- effects ---
# Shadows under floating windows and the bar's popups; blur (off by
# default, it costs GPU) frosts what's behind the bar's popups when on.
# Tiled windows stay flat and opaque so the desktop stays quick. The
# layout picker's Effects toggles flip these live (persisted to
# mango-effects, the way the gap slider is).
shadows=1
shadow_only_floating=1
layer_shadows=1
shadows_size=12
shadows_blur=18
shadowscolor=0x00000099
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
# windows slide in and fade out; popups and rofi animate too
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
animation_duration_open=300
animation_duration_close=250
animation_duration_tag=250
animation_duration_move=250
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# --- outputs ---
# Every monitor runs its preferred mode (normally its highest refresh
# rate) at scale 1. A monitorrule per output overrides that, in local.conf
# (templates there): name is a regex, scale can be fractional (1.25, 1.5),
# vrr:1 turns on adaptive sync.
# tearing only for fullscreen clients that ask for it (games)
allow_tearing=2

# --- input ---
numlockon=1
repeat_rate=50
repeat_delay=300
tap_to_click=1
trackpad_natural_scrolling=1
disable_while_typing=1
sloppyfocus=1
# floating windows snap to the edges and each other while dragged
enable_floating_snap=1
snap_distance=30
# hot corner: push the cursor into the corner for the overview
enable_hotarea=1
hotarea_size=10

# --- layout: master/stack on every tag ---
new_is_master=1
default_mfact=0.55
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
tagrule=id:10,layout_name:tile
tagrule=id:11,layout_name:tile
tagrule=id:12,layout_name:tile

# --- wallpaper and colors ---
# The daemon first, then theme.conf: the wallpaper (an `awww img`
# exec-once) and the colors taken from it, written by the wallpaper
# picker into the state folder. Everything else that starts with the
# session is in ~/.config/mango/autostart.conf, which is yours.
exec-once=awww-daemon
source-optional=~/.local/state/mango/theme.conf

# --- layer rules ---
# rofi (the launcher / power fallback when the bar is down) zooms instead of sliding
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# --- floating rules: the setup's own. Tag homes, the drop-down terminal
# and your rules are in ~/.config/mango/rules.conf (the panel's Rules tab) ---
# the bar's Settings window and the network app (quickshell's toplevels)
windowrule=isfloating:1,appid:org.quickshell
windowrule=isfloating:1,appid:mpv
windowrule=isfloating:1,appid:butterview
windowrule=isfloating:1,appid:qimgv
windowrule=isfloating:1,appid:galculator
windowrule=isfloating:1,appid:transmission-gtk
windowrule=isfloating:1,appid:nwg-look
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:swappy
windowrule=isfloating:1,appid:thunar,title:^(File Operation Progress|Confirm|Properties|Rename|Create|Error|Question|Warning).*
