# local.conf — your settings. The installer creates this file once and
# never touches it again, and config.conf reads it last, so anything here
# overrides the same setting there. Every example below is real: remove
# the leading # and it works as is. Keys live in keybinds.conf (also
# yours); add new ones here only on keys that file leaves unbound.
# Reload with Super+Shift+r. Reference: https://justaguy.dev/drew/mangowc-setup/wiki

# Monitors — `wlr-randr` lists names and modes; one line per output.
#monitorrule=name:^DP-1$,width:2560,height:1440,refresh:144,x:0,y:0,scale:1,vrr:1
#monitorrule=name:^eDP-1$,scale:1.5

# Looks and feel — any option from config.conf can be restated here.
#gappih=10
#gappiv=10
#borderpx=3
#repeat_rate=40

# Start something else with the session.
#exec-once=nm-applet

# An extra binding, on keys keybinds.conf leaves free.
#bind=SUPER+CTRL,b,spawn,firefox-esr --private-window
