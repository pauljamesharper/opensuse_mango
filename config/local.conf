# local.conf — your settings. It is read last, after the setup's defaults
# (~/.local/share/mango/defaults.conf), so a line here overrides the same
# setting there. The installer copies it in on first install and, on
# update, replaces it only while you have not edited it; an edited copy
# stays, with a newer shipped one beside it as local.conf.new.
# Every example below works once its leading # is removed. Keys live
# in keybinds.conf (also yours); add new ones here only on keys that
# file leaves unbound.
# Reload with Super+Shift+r. Reference: https://justaguy.dev/butter/mango/wiki

# Monitors — `wlr-randr` lists names and modes; one line per output.
# A layout kept in the bar's Displays card wins over these.
#monitorrule=name:^DP-1$,width:2560,height:1440,refresh:144,x:0,y:0,scale:1,vrr:1
#monitorrule=name:^eDP-1$,scale:1.5

# Input and focus — any option from defaults.conf can be restated here.
# Gaps, border width, blur, shadows, animations and opacity belong to the
# bar: once moved there, it re-applies its own values over this file;
# border colors come from the wallpaper picker.
#repeat_rate=40
#repeat_delay=250
#sloppyfocus=0
#tap_to_click=0

# What starts with the session is in autostart.conf, beside this file.

# An extra binding, on keys keybinds.conf leaves free.
#bind=SUPER+CTRL,b,spawn,firefox-esr --private-window

# A drop-down app (scratchpad): the key launches it the first time, then
# shows and hides it. The rule matches the app id (`mmsg get
# focusing-client` shows it) and sets its size. Like Super+` for kitty.
#bind=SUPER+ALT,a,toggle_named_scratchpad,org.pulseaudio.pavucontrol,none,pavucontrol
#windowrule=isnamedscratchpad:1,width:0.5,height:0.6,appid:org.pulseaudio.pavucontrol
