# rules.conf — your window rules: which apps float, open on a tag, or
# are a scratchpad (a drop-down window a key shows and hides). Edit it
# in the bar's settings panel (Super+Shift+t → Rules) or here; reload
# with Super+Shift+r. One windowrule= per line, keys from mango's docs;
# a "# note" line right above a rule is shown in the panel.
# Find an app's id with `mmsg get focusing-client` (or the panel's
# "Pick a window"). The setup's own floating rules (image viewers,
# mixers, dialogs) are in ~/.local/share/mango/defaults.conf.

# --- tags: apps with a home tag; mango switches there when the window opens ---
windowrule=tags:8,appid:^(discord|Discord)$
windowrule=tags:9,appid:^(gimp|Gimp|org\.gimp\.GIMP)$
windowrule=tags:10,appid:^(com\.obsproject\.Studio|obs)$

# --- floating ---
windowrule=isfloating:1,appid:butterview

# --- scratchpads: the toggle key and command are the matching toggle_named_scratchpad bind in keybinds.conf ---
# Drop-down terminal
windowrule=isnamedscratchpad:1,width:0.6,height:0.6,appid:kitty-scratch
