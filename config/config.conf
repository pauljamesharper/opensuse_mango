# ~/.config/mango/config.conf — what mango reads. Four parts, in order:
#   the setup's defaults   ~/.local/share/mango/defaults.conf   (replaced on update)
#   what starts with you   ~/.config/mango/autostart.conf       (yours after install)
#   your keys              ~/.config/mango/keybinds.conf        (yours after install)
#   your window rules      ~/.config/mango/rules.conf           (yours after install)
#   your overrides         ~/.config/mango/local.conf           (yours, read last: wins)
# Super+Shift+r reloads. Check for mistakes: mango -p
source=~/.local/share/mango/defaults.conf
source=~/.config/mango/autostart.conf
source=~/.config/mango/keybinds.conf
source=~/.config/mango/rules.conf
source-optional=~/.config/mango/local.conf
