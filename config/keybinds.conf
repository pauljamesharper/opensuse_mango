# keybinds.conf — every key, mouse and gesture binding, in one file that
# is yours: the installer puts it here once and never overwrites it (an
# update that changes the defaults leaves keybinds.conf.new beside it).
# Edit freely; Super+Shift+r reloads. The bar's keybinds popup (Super+/)
# reads this file, and "# Text" above a bind is the description it shows.
#
# To change a key, change the line here. mango has no unbind, and every
# matching bind fires, so a second bind=... for the same keys elsewhere
# (local.conf) would run both.
#
# Format: bind=MODS,key,action[,args]   mousebind=MODS,button,action,arg
#         axisbind=MODS,UP|DOWN,action  gesturebind=MODS,direction,fingers,action
# Modifiers: SUPER, SHIFT, CTRL, ALT, joined with +; none for no modifier.

# --- apps ---
# Terminal
bind=SUPER,Return,spawn,kitty
# Drop-down terminal (launches the first time, then toggles)
bind=SUPER,grave,toggle_named_scratchpad,kitty-scratch,none,kitty --class kitty-scratch
# App launcher
bind=SUPER,space,spawn,~/.local/share/mango/scripts/launcher
# Browser
bind=SUPER,b,spawn,firefox-esr
# Browser (private)
bind=SUPER+SHIFT,b,spawn,firefox-esr --private-window
# File manager
bind=SUPER,f,spawn,thunar
# Editor
bind=SUPER,e,spawn,geany
# Discord (opens on tag 8)
bind=SUPER,d,spawn,Discord
# GIMP (opens on tag 9)
bind=SUPER,g,spawn,gimp
# OBS (opens on tag 10)
bind=SUPER,o,spawn,obs
# Power menu
bind=SUPER,x,spawn,~/.local/share/mango/scripts/power
# Keybinding help
bind=SUPER,slash,spawn,qs -p ~/.local/share/mango/quickshell ipc call keybinds toggle
# Lock screen
bind=SUPER+CTRL,l,spawn,~/.local/share/mango/scripts/lock

# --- bar popups (quickshell IPC) ---
# Wallpaper picker (re-themes the desktop from the image)
bind=SUPER+SHIFT,p,spawn,qs -p ~/.local/share/mango/quickshell ipc call wallpapers toggle
# Command menu
bind=SUPER+SHIFT,m,spawn,qs -p ~/.local/share/mango/quickshell ipc call commands toggle
# Network app
bind=SUPER+SHIFT,n,spawn,~/.local/share/mango/scripts/network
# Layout settings
bind=SUPER+SHIFT,t,spawn,qs -p ~/.local/share/mango/quickshell ipc call layouts toggle

# --- windows ---
# Close window
bind=SUPER,q,killclient,
# Quit mango
bind=SUPER+SHIFT,q,quit
# scripts/mango-reload: reload_config, then the bar re-applies the gaps
# the reload just reset to config.conf's values
# Reload config
bind=SUPER+SHIFT,r,spawn,~/.local/share/mango/scripts/mango-reload
# Toggle floating
bind=SUPER+SHIFT,space,togglefloating,
# Fullscreen
bind=SUPER+SHIFT,f,togglefullscreen,
# Cycle layouts
bind=SUPER,t,switch_layout
# Monocle layout
bind=SUPER,w,setlayout,monocle
# Overview of all windows
bind=SUPER,Tab,toggleoverview,
# Next / previous window
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# focus / move (arrows and hjkl)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# monitors (comma / period, like dwm)
# Focus previous / next monitor
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
# Send window to previous / next monitor
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# resize master area / master count
bind=SUPER+CTRL,Left,setmfact,-0.02
bind=SUPER+CTRL,Right,setmfact,+0.02
bind=SUPER+CTRL,Up,incnmaster,+1
bind=SUPER+CTRL,Down,incnmaster,-1

# --- tags (workspaces): 12, like the other setups. 10-12 need the
# butterrepo mangowc build (patches/12-tags.patch); stock mango has 9. ---
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10
bind=SUPER,minus,view,11
bind=SUPER,equal,view,12
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10
bind=SUPER+SHIFT,minus,tag,11
bind=SUPER+SHIFT,equal,tag,12

# --- media / screenshots ---
# Volume up
bind=NONE,XF86AudioRaiseVolume,spawn,~/.local/share/mango/scripts/changevolume up
# Volume down
bind=NONE,XF86AudioLowerVolume,spawn,~/.local/share/mango/scripts/changevolume down
# Mute
bind=NONE,XF86AudioMute,spawn,~/.local/share/mango/scripts/changevolume mute
# Super+F12/F11/F10 do the same (same keys as the other setups)
# Volume up
bind=SUPER,F12,spawn,~/.local/share/mango/scripts/changevolume up
# Volume down
bind=SUPER,F11,spawn,~/.local/share/mango/scripts/changevolume down
# Mute
bind=SUPER,F10,spawn,~/.local/share/mango/scripts/changevolume mute
# Play/pause, next, previous (whatever is playing: playerctl picks the
# most recently active player)
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
# Brightness up
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
# Brightness down
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
# Screenshot (full screen)
bind=SUPER,s,spawn,~/.local/share/mango/scripts/screenshot full
# Screenshot (select region)
bind=SUPER+SHIFT,s,spawn,~/.local/share/mango/scripts/screenshot region
# Screenshot (region to clipboard)
bind=SUPER+CTRL,s,spawn,~/.local/share/mango/scripts/screenshot copy
# Screenshot (region, annotate in swappy)
bind=SUPER+ALT,s,spawn,~/.local/share/mango/scripts/screenshot edit
# the Print key does the same (no Alt+Print: that's the kernel's SysRq)
# Screenshot (full screen)
bind=NONE,Print,spawn,~/.local/share/mango/scripts/screenshot full
# Screenshot (select region)
bind=SHIFT,Print,spawn,~/.local/share/mango/scripts/screenshot region
# Screenshot (region to clipboard)
bind=CTRL,Print,spawn,~/.local/share/mango/scripts/screenshot copy

# --- mouse ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# Super + scroll wheel walks the tags
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright

# --- touchpad gestures ---
# three fingers: swipe through the tags, up or down for the overview
gesturebind=none,left,3,viewtoright
gesturebind=none,right,3,viewtoleft
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview
# four fingers: swipe through the tags carrying the focused window
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,right,4,viewtoleft_have_client
