# ~/.config/mango/autostart.conf — what starts with the session. Yours
# after install: add a line, drop a line, swap a program. mango forks
# every exec-once at once and has no way to cancel one, which is why
# these live here and not in the setup's defaults.conf. An update that
# changes this file leaves the new one beside as autostart.conf.new.
# (The wallpaper daemon and the wallpaper itself start from defaults.conf
# and theme.conf: they are the theming system, not an app of yours.)

# Push the session environment to systemd/D-Bus-activated services, then
# restart the portals (screen sharing, file dialogs) in that order — one
# line, because mango forks every exec-once at once. A portal left over from
# an earlier login in this same user session (an X11 WM, or a previous mango
# with a stale WAYLAND_DISPLAY) would otherwise serve the wrong desktop and
# offer no ScreenCast. (KITTY_CONFIG_DIRECTORY is deliberately not pushed:
# the user manager outlives a logout, so it would leak into the next X11
# session's D-Bus-launched terminals. Like the other setups, it stays a
# plain export — ~/.config/mango/env via mango-session — so each session's
# kitty reads only its own folder.)
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP MANGO_INSTANCE_SIGNATURE && systemctl --user restart xdg-desktop-portal-wlr xdg-desktop-portal-gtk xdg-desktop-portal
# notifications: the shipped template, colored by the wallpaper picker
exec-once=dunst -config ~/.local/state/mango/dunstrc
# polkit agent (password prompts for mounting, updates, bar restarts)
exec-once=lxpolkit
# clipboard history store (nothing in the setup reads it yet; `cliphist list`)
exec-once=wl-paste --watch cliphist store
# power the monitor down after 15 min idle, wake on input
exec-once=~/.local/share/mango/scripts/idle
# quickshell bar (start: no-op if already running, so a config reload is
# safe; also hands the bar the GTK icon theme)
exec-once=~/.local/share/mango/scripts/bar start

# yours, e.g.
#exec-once=nm-applet
#exec-once=blueman-applet
